[package]
name = "ikigai-fs"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Capability-gated file/store ikigai module: jailed to a root with a default-deny path-ACL; SOURCE/SINK/EXISTS/DELETE. A cfg-gated backend links into native (std::fs) and wasm32 (browser localStorage) hosts from one crate."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-fs"
homepage = "https://github.com/ikigai-rs/ikigai-fs"
readme = "README.md"
keywords = ["ikigai", "roc", "resolution", "module", "capability"]
categories = ["filesystem", "wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.2.0 is the streams release (ledger #2261). The old 0.1 pin meant
# <0.2.0 under 0.x caret rules, so consumers must move with the core API.
# 0.2.1 is the true minimum: `Spill`, `ContentHasher` and `Kernel::with_spill`, which
# `FileSpill` implements and uses (ledger #2372, #2241), are new there.
# 0.2.3 is the first release with `ArgSpec::reads_body` (ledger #2402), which the Sink
# declares on `content` so an attached body streams to disk (ledger #2469).
ikigai-core = "0.2.3"
async-trait = "0.1"
# Same vetted RFC 4648 implementation/profile as ikigai-http::base64.
base64 = "0.22"

# Native backend: the jail resolves every name with `openat` relative to a handle on
# its parent (`O_NOFOLLOW`, `O_DIRECTORY`), reads the directory to learn a name's
# on-disk spelling, and reads/writes on the handle the walk produced. `rustix` is the
# safe wrapper over exactly those calls (no `unsafe` here). 1.0 carries every call used
# (`openat`, `statat`, `mkdirat`, `unlinkat`, `fstat`, `renameat`, `linkat`, `Dir::read_from`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = ["fs"] }
# Unpredictable names for exclusively-created, handle-relative staging files.
getrandom = "0.3"
# The `Stream` a file `Replay` reader implements, and a streamed Sink polls: the
# same futures-core `ikigai_core::ByteStream` is built on.
futures-core = "0.3"

# Browser backend: localStorage via web-sys. wasm32-only — native hosts don't pull
# it, so the `std::fs` path stays dependency-light.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
futures = "0.3"

# The disk fixture and its RDF/random dependencies are native-only.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.11 enables DATATYPES and
# FAILURES by default and links the core 0.2.0 streams release.
ikigai-conformance = "0.11.0"

# The web door a file body is served through in `tests/validator.rs` (ledger #2474):
# its `206`/`304` over a `Replay` that states a strong validator. Unix only, like the
# test (and like ikigai-web's own spill tests).
[target.'cfg(unix)'.dev-dependencies]
ikigai-web = "0.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
